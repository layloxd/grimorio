<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Grimorio — Image Sniffer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 13px/1.4 system-ui, -apple-system, sans-serif;
      color: #e9e6df;
      background: #17171a;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    
    /* Top Toolbar */
    header {
      background: #1e1e24;
      border-bottom: 1px solid #2e2e38;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #efece6;
    }
    .brand img { width: 20px; height: 20px; }
    .badge-count {
      background: #2b2b36;
      color: #a9a59c;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
    }

    /* Filters Bar */
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a9a59c;
    }
    input[type="text"] {
      background: #25252e;
      border: 1px solid #3a3a46;
      border-radius: 6px;
      color: #e9e6df;
      padding: 5px 9px;
      font-size: 12px;
      outline: none;
      width: 140px;
    }
    input[type="text"]:focus {
      border-color: #555566;
    }
    input[type="range"] {
      accent-color: #4caf7d;
      width: 80px;
    }
    select {
      background: #25252e;
      border: 1px solid #3a3a46;
      border-radius: 6px;
      color: #e9e6df;
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
      max-width: 160px;
    }

    .btn {
      font: 500 12px/1 system-ui, sans-serif;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #3a3a46;
      background: #2b2b36;
      color: #e9e6df;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #363644;
      border-color: #4c4c5c;
    }
    .btn.primary {
      background: #3b7d5a;
      border-color: #4caf7d;
      color: #ffffff;
      font-weight: 600;
    }
    .btn.primary:hover {
      background: #449168;
    }
    .btn.primary:disabled {
      background: #283e33;
      border-color: #2e4d3e;
      color: #7b9e8b;
      cursor: default;
    }

    /* Type Chips */
    .chips-bar {
      background: #19191e;
      border-bottom: 1px solid #282832;
      padding: 6px 16px;
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
      flex-shrink: 0;
    }
    .chip {
      padding: 3px 8px;
      border-radius: 4px;
      background: #22222a;
      color: #9d9aa3;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .chip.active {
      background: #2e3532;
      color: #5ad493;
      border-color: #3b7d5a;
      font-weight: 600;
    }

    /* Grid Area */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }
    .card {
      background: #202027;
      border: 2px solid #2e2e38;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.1s;
    }
    .card:hover {
      border-color: #4b4b5c;
      transform: translateY(-2px);
    }
    .card.selected {
      border-color: #4caf7d;
      background: #222925;
    }
    .thumbnail-container {
      width: 100%;
      height: 140px;
      background: repeating-conic-gradient(#1c1c22 0% 25%, #25252d 0% 50%) 50% / 16px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .thumbnail-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .checkbox-overlay {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(20,20,24,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: transparent;
      transition: all 0.15s;
    }
    .card.selected .checkbox-overlay {
      background: #4caf7d;
      border-color: #4caf7d;
      color: #ffffff;
    }
    .card-meta {
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #9d9aa3;
      border-top: 1px solid #2a2a34;
    }
    .badge {
      text-transform: uppercase;
      font-weight: 600;
      font-size: 10px;
      background: #2b2b36;
      padding: 1px 4px;
      border-radius: 3px;
    }

    /* Footer status */
    footer {
      background: #1e1e24;
      border-top: 1px solid #2e2e38;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #8d8a83;
      flex-shrink: 0;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #8d8a83;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand">
        <img src="iconos/32.png" alt="">
        <span>Grimorio Sniffer</span>
      </div>
      <span class="badge-count" id="totalCount">0</span>
    </div>

    <div class="toolbar-actions">
      <div class="filter-group">
        <label for="minWidth">Min W: <span id="minWidthVal">100</span>px</label>
        <input type="range" id="minWidth" min="0" max="1200" step="50" value="100">
      </div>
      <div class="filter-group">
        <label for="minHeight">Min H: <span id="minHeightVal">100</span>px</label>
        <input type="range" id="minHeight" min="0" max="1200" step="50" value="100">
      </div>
      <input type="text" id="searchInput" placeholder="Search URL/alt...">
      
      <button class="btn" id="btnSelectAll">Select All</button>
      <button class="btn" id="btnDeselectAll">Clear</button>

      <select id="folderSelect">
        <option value="">(All Library)</option>
      </select>

      <button class="btn primary" id="btnSave" disabled>Save Selected (0)</button>
    </div>
  </header>

  <div class="chips-bar">
    <span style="color: #6a6770; margin-right: 4px;">Format:</span>
    <div class="chip active" data-type="all">ALL</div>
    <div class="chip" data-type="jpg">JPG</div>
    <div class="chip" data-type="png">PNG</div>
    <div class="chip" data-type="webp">WEBP</div>
    <div class="chip" data-type="svg">SVG</div>
    <div class="chip" data-type="gif">GIF</div>
    <div class="chip" data-type="other">OTHER</div>
  </div>

  <main id="mainScroll">
    <div class="grid" id="imageGrid"></div>
    <div class="empty-state" id="emptyState" hidden>No images match the current filters.</div>
  </main>

  <footer>
    <div id="selectionSummary">0 of 0 selected</div>
    <div id="statusMessage">Scanning page...</div>
  </footer>

  <script src="colector-panel.js"></script>
</body>
</html>
