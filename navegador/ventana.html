<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font: 13px/1.4 system-ui, -apple-system, sans-serif; color: #e9e6df; background: #17171a;
      margin: 0; padding: 14px 16px; width: 280px; user-select: none;
    }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .brand-title { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    h1 img { width: 18px; height: 18px; }
    .estado { color: #a9a59c; margin-bottom: 12px; font-size: 12px; }
    .estado.mal { color: #e08a7f; }

    /* Action Grid */
    .acciones {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .btn-accion {
      background: #23232b;
      border: 1px solid #363642;
      border-radius: 8px;
      color: #efece6;
      padding: 9px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-accion:hover {
      background: #2f2f3b;
      border-color: #4caf7d;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-accion svg {
      width: 18px;
      height: 18px;
      stroke: #4caf7d;
    }
    .btn-accion:active {
      transform: translateY(0);
    }

    /* Destino / Carpeta */
    label { display: block; color: #a9a59c; font-size: 11px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    select {
      width: 100%; background: #222227; color: #e9e6df; border: 1px solid #3a3a42;
      border-radius: 6px; padding: 6px 8px; font-size: 12px; outline: none; margin-bottom: 12px;
    }
    select:focus { border-color: #555566; }
    code { background: #222227; padding: 1px 4px; border-radius: 4px; }
    
    /* Ultimas guardadas */
    h2 { font-size: 11px; color: #8d8a83; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 0 6px; }
    .ultima { display: flex; gap: 8px; align-items: baseline; padding: 5px 6px; border-radius: 6px; font-size: 12px; }
    .ultima[data-id]:hover { background: #222227; cursor: pointer; }
    .ultima .marca { width: 12px; text-align: center; }
    .ultima .nombre { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ultima .cuando { color: #8d8a83; font-size: 11px; }
    .guardada .marca { color: #4caf7d; } .repetida .marca { color: #5b9bd5; }
    .error .marca { color: #e0675a; } .camino .marca { color: #8d8a83; }

    .pista { color: #6e6b66; font-size: 11px; margin-top: 12px; text-align: center; border-top: 1px solid #25252c; padding-top: 8px; }
  </style>
</head>
<body>
  <h1>
    <div class="brand-title">
      <img src="iconos/32.png" alt="">
      <span>Grimorio</span>
    </div>
  </h1>

  <div class="estado" id="estado" data-texto="ventanaMirando"></div>

  <!-- Quick Action Buttons -->
  <div class="acciones" id="panelAcciones">
    <button class="btn-accion" id="btnColector" title="Find and download all images from current page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <span data-texto="btnSniffer">Sniff Images</span>
    </button>

    <button class="btn-accion" id="btnCapturaPagina" title="Scroll and capture full page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="12" y1="18" x2="12" y2="12"></line>
        <line x1="9" y1="15" x2="15" y2="15"></line>
      </svg>
      <span data-texto="btnFullCapture">Full Page</span>
    </button>

    <button class="btn-accion" id="btnCapturaVisible" title="Capture current visible screen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span data-texto="btnVisibleCapture">Screen Area</span>
    </button>

    <button class="btn-accion" id="btnMarcador" title="Bookmark page with preview thumbnail">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
      <span data-texto="btnSaveBookmark">Save Page</span>
    </button>
  </div>

  <div id="destino" hidden>
    <label for="carpeta" data-texto="ventanaGuardarEn"></label>
    <select id="carpeta"></select>
  </div>

  <div id="ultimas" hidden>
    <h2 data-texto="ventanaUltimas"></h2>
    <div id="lista"></div>
  </div>

  <p class="pista" data-texto="ventanaPista"></p>
  <script src="ventana.js"></script>
</body>
</html>
